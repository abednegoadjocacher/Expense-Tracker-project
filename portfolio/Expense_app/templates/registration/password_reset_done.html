{% extends "Expense_app/base.html" %}
{% block title %}Reset link sent{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto py-6">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body text-center space-y-3">
            <h1 class="card-title justify-center text-2xl">Check your email</h1>
            <p class="text-sm text-base-content/70">
                If an account exists for that email address, we've sent instructions for setting a new password.
            </p>
            <div class="card-actions justify-center pt-2">
                <a href="{% url 'login' %}" class="btn btn-outline">Back to log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
