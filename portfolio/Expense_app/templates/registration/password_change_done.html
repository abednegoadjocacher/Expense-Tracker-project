{% extends "Expense_app/base.html" %}
{% block title %}Password changed{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto py-6">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body text-center space-y-3">
            <h1 class="card-title justify-center text-2xl">Password updated</h1>
            <p class="text-sm text-base-content/70">Your password has been changed successfully.</p>

        </div>
    </div>
</div>
{% endblock content %}
