{% extends "Expense_app/base.html" %}
{% block title %}Password reset complete{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto py-6">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body text-center space-y-3">
            <h1 class="card-title justify-center text-2xl">Password reset complete</h1>
            <p class="text-sm text-base-content/70">Your new password has been set. You can now sign in.</p>
            <div class="card-actions justify-center pt-2">
                <a href="{% url 'login' %}" class="btn btn-primary">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
